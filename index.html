<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="REST TIME">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>REST CALCULATOR</title>
<style>
:root{--bg:#06101c;--panel:#0b1827;--line:#294058;--txt:#eef5fb;--mut:#91a5bb;--cyan:#6fd7ff;--green:#76e0a0;--amber:#ffd477;--red:#ff8888}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:end;padding:5px 3px 11px;border-bottom:1px solid var(--line)}.title{font-size:25px;font-weight:800;letter-spacing:.8px}.sub{font-size:11px;color:var(--mut);letter-spacing:.8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:10px}h2{font-size:14px;letter-spacing:.7px;margin:0 0 10px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.grid>div{min-width:0;overflow:hidden}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{display:block;font-size:10px;color:var(--mut);letter-spacing:.4px;margin-bottom:5px}input,select{box-sizing:border-box;width:100%;max-width:100%;min-width:0;height:44px;border-radius:8px;border:1px solid var(--line);background:#071522;color:var(--txt);padding:7px 9px;font-size:17px}button{height:44px;border-radius:8px;border:1px solid var(--line);background:#102b40;color:var(--cyan);font-weight:800;letter-spacing:.5px;width:100%}.primary{background:#17435a}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modes input{display:none}.modes span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#071522;font-size:13px;font-weight:800}.modes input:checked+span{border-color:var(--cyan);background:#0e2b3d}.error{display:none;color:var(--red);font-size:12px;margin-top:8px}.hidden{display:none!important}
.mfd{background:#02070b;border:2px solid #243b4d;border-radius:9px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mfdhead{display:flex;justify-content:space-between;color:#8aa0b4;font-size:11px;border-bottom:1px solid #233747;padding-bottom:7px}.mfdmain{text-align:center;padding:15px 5px 10px}.state{color:var(--green);font-size:12px;font-weight:900;letter-spacing:1px}.pilot{color:var(--cyan);font-size:24px;font-weight:900;margin:8px 0}.big{font-size:43px;font-weight:900;letter-spacing:2px}.range{font-size:13px;color:#a9bac9;margin-top:4px}.utc{color:var(--amber);font-size:11px;margin-top:4px}.next{margin-top:12px;border-top:1px solid #233747;padding-top:10px;color:#9db1c3;font-size:12px}
.row{display:grid;grid-template-columns:65px 1fr 1fr 1.2fr;gap:7px;padding:10px 4px;border-top:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;align-items:center}.row .p{color:var(--cyan);font-weight:800}.count{font-weight:900;text-align:right}.waiting{color:var(--amber)}.active{color:var(--green)}.done{color:#6f8193}.footer{font-size:10px;color:#687d91;line-height:1.4;margin:12px 3px}
body.light{--bg:#f4f1ed;--panel:#fff;--line:#d6cfc7;--txt:#222;--mut:#6c6863;--cyan:#b4002d;--green:#19734a;--amber:#9b4d00;--red:#a30000}body.light .mfd{background:#fff;border-color:#b9b1a9}body.light input,body.light select{background:#faf8f5;color:#222}body.light .modes span{background:#faf8f5}body.light .modes input:checked+span{background:#f5e7ea;border-color:#b4002d}body.light button{background:#f7e6e9;color:#a9002b;border-color:#d3b8be}body.light .primary{background:#b4002d;color:#fff;border-color:#b4002d}.customName{height:38px;font-size:14px}
@media(max-width:600px){.grid3{grid-template-columns:1fr}.row{grid-template-columns:52px 1fr 1fr 1.3fr;font-size:11px}.big{font-size:38px}}
</style>
<style>
/* iPhone/iOS: keep native time controls inside their grid cells */
.grid > div { min-width: 0; width: 100%; }
.grid input[type="time"] {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;
  margin: 0;
}
@media (max-width: 600px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .grid > div { min-width: 0; }
  .grid input[type="time"] { font-size: 16px; }
}
</style>
<style>
.flight-times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:100%;max-width:100%}
.time-field{min-width:0;width:100%;max-width:100%;overflow:hidden}
.time-input-wrap{min-width:0;width:100%;max-width:100%;overflow:hidden}
.flight-times input[type=time]{display:block;box-sizing:border-box;width:100%;max-width:100%;min-width:0;margin:0}
@media(max-width:600px){.flight-times{gap:6px}.flight-times input[type=time]{font-size:16px}}
</style><style>
/* V17: isolated flight-time cards */
.flight-time-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  width:100%;
  max-width:100%;
  min-width:0;
}
.flight-time-card{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  overflow:hidden;
}
.flight-time-card label{
  display:block;
  width:100%;
  box-sizing:border-box;
}
.flight-time-card input[type="time"]{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  box-sizing:border-box;
  margin:0;
}
#appVersion{
  text-align:center;
  font-size:9px;
  line-height:12px;
  opacity:.35;
  margin:10px 0 4px;
  letter-spacing:.4px;
}
@media(max-width:600px){
  .flight-time-grid{gap:6px}
  .flight-time-card input[type="time"]{font-size:16px}
}
</style><style>
/* V18: border belongs to the wrapper, not the native iOS time control */
.flight-time-card .time-box{
  display:flex;
  align-items:center;
  width:100%;
  height:44px;
  min-width:0;
  box-sizing:border-box;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:8px;
  background:#071522;
}
.flight-time-card .time-box input[type="time"]{
  appearance:none;
  -webkit-appearance:none;
  border:0!important;
  outline:0;
  box-shadow:none!important;
  background:transparent!important;
  color:var(--txt);
  width:100%!important;
  max-width:100%!important;
  min-width:0!important;
  height:42px!important;
  min-height:0!important;
  padding:7px 9px!important;
  margin:0!important;
  box-sizing:border-box!important;
  border-radius:7px!important;
}
.flight-time-card .time-box input[type="time"]::-webkit-date-and-time-value{
  text-align:center;
}
</style></head><body><div class="wrap">
<div class="top"><div><div class="title">REST CALCULATOR</div><div class="sub">FLIGHT REST MANAGEMENT</div></div><div style="display:flex;align-items:center;gap:8px"><button id="theme" style="width:auto;padding:0 12px;height:34px">LIGHT</button><div class="sub">UTC</div></div></div>

<section class="card"><h2>FLIGHT DATA · ALL TIMES UTC</h2>
<div class="flight-time-grid">
  <div class="flight-time-card">
    <label>DEPARTURE · UTC</label>
    <div class="time-box"><input id="dep" type="time" value="15:00"></div>
  </div>
  <div class="flight-time-card">
    <label>ARRIVAL · UTC</label>
    <div class="time-box"><input id="arr" type="time" value="01:00"></div>
  </div>
</div>
<div style="height:10px"></div><div class="grid3" id="crewGrid">
<div><label>REST 1</label><select id="r1"><option>FO</option><option selected>CPT</option><option>CUSTOM</option></select><input id="c1" class="customName hidden" placeholder="Nombre" maxlength="24" style="margin-top:6px"></div>
<div><label>REST 2</label><select id="r2"><option>FO</option><option selected>CPT</option><option>CUSTOM</option></select><input id="c2" class="customName hidden" placeholder="Nombre" maxlength="24" style="margin-top:6px"></div>
<div id="rest3wrap"><label>REST 3</label><select id="r3"><option selected>FO</option><option>CPT</option><option>CUSTOM</option></select><input id="c3" class="customName hidden" placeholder="Nombre" maxlength="24" style="margin-top:6px"></div>
</div>
<div id="err" class="error"></div></section>

<section class="card">
<h2>REST PARAMETERS · MINUTES</h2>
<div class="grid3">
  <div><label>TIME AFTER DEPARTURE</label><input id="before" type="number" min="0" value="30"></div>
  <div><label>TIME BETWEEN RESTS</label><input id="between" type="number" min="0" value="15"></div>
  <div><label>TIME BEFORE ARRIVAL</label><input id="after" type="number" min="0" value="30"></div>
</div>
</section>
<section class="card"><button class="primary" id="calc">RECALCULATE PLAN</button></section>

<section class="card hidden" id="live"><div class="mfd"><div class="mfdhead"><span>REST TIME</span><span id="mfdclock">--:--:-- UTC</span></div><div class="mfdmain"><div class="state" id="status">—</div><div class="pilot" id="pilot">—</div><div class="big" id="clock">00:00:00</div><div class="range" id="range">—</div><div class="utc">ALL COUNTDOWNS REFER TO UTC</div><div class="next" id="next"></div></div></div></section>

<section class="card hidden" id="planbox"><h2>REST PLAN · UTC</h2><div id="durationLine" style="font-size:11px;color:var(--mut);margin:-3px 0 8px">REST DURATION · —</div><div id="rows"></div></section>

</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),KEY="restPlannerV22";let plan=null;
const mins=v=>{let p=(v||"").split(":");return p.length===2?+p[0]*60 + +p[1]:NaN};
const tm=x=>{x=((Math.round(x)%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
const sf=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const fmtDur=m=>{m=Math.round(m);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
function err(t){$("err").textContent=t;$("err").style.display="block"}function clearErr(){$("err").style.display="none"}
function build(d,a,n,b,g,e,ids){let f=a-d;if(f<=0)f+=1440;let usable=f-b-e-(n-1)*g;if(usable<=0)throw Error("INSUFFICIENT FLIGHT TIME");let r=usable/n,st=d+b,rests=[];for(let i=0;i<n;i++){rests.push({start:st,end:st+r,pilot:ids[i]});st+=r+g}return{dep:d,arr:a,flight:f,rest:r,rests}}
function toggleCustom(i){
let s=$("r"+i),c=$("c"+i); if(!s||!c)return;
c.classList.toggle("hidden",s.value!=="CUSTOM");
}
function setCrewMode(){
let four=+document.querySelector('input[name="pilots"]:checked').value===4;
let old={};for(let i=1;i<=3;i++){old["r"+i]=$("r"+i)?.value;old["c"+i]=$("c"+i)?.value||""}
$("rest3wrap").classList.toggle("hidden",four);
if(four){
$("r1").innerHTML='<option>CREW 1</option><option>CREW 2</option>';
$("r2").innerHTML='<option>CREW 1</option><option>CREW 2</option>';
$("r1").value=(old.r1==="CREW 2")?"CREW 2":"CREW 1";
$("r2").value=(old.r2==="CREW 1")?"CREW 1":"CREW 2";
for(let i=1;i<=3;i++)if($("c"+i)){$("c"+i).value="";$("c"+i).classList.add("hidden")}
}else{
for(let i=1;i<=3;i++)$("r"+i).innerHTML='<option>FO</option><option>CPT</option><option>CUSTOM</option>';
for(let i=1;i<=3;i++){
let v=old["r"+i];
$("r"+i).value=["FO","CPT","CUSTOM"].includes(v)?v:(i===2?"CPT":"FO");
$("c"+i).value=old["c"+i]||"";
toggleCustom(i);
}
if(!window.crewInitialized){
$("r1").value="FO";$("r2").value="CPT";$("r3").value="FO";
for(let i=1;i<=3;i++)toggleCustom(i);
window.crewInitialized=true;
}
}
}
function crewValue(i){
let s=$("r"+i);if(!s)return "";
return s.value==="CUSTOM"?(($("c"+i).value||"").trim()||"CUSTOM"):s.value;
}
function applyTheme(){
let light=localStorage.getItem("restThemeV8")==="light";document.body.classList.toggle("light",light);$("theme").textContent=light?"DARK":"LIGHT";
}
function calculate(){clearErr();let d=mins($("dep").value),a=mins($("arr").value),b=+$("before").value,g=+$("between").value,e=+$("after").value,n=+document.querySelector('input[name="pilots"]:checked').value===3?3:2,ids=[crewValue(1),crewValue(2),crewValue(3)];if(ids.some((x,i)=>i< (n) && (!x||x==="CUSTOM")))return err("ENTER A CUSTOM CREW NAME");if(!Number.isFinite(d)||!Number.isFinite(a)||[b,g,e].some(x=>!Number.isFinite(x)||x<0))return err("CHECK FLIGHT DATA");try{plan=build(d,a,n,b,g,e,ids);render();save();update()}catch(x){err(x.message)}}
function render(){if(!plan||!plan.rests)return;$("durationLine").textContent="REST DURATION · "+fmtDur(plan.rest ?? plan.restMin ?? 0);$("rows").innerHTML=plan.rests.map((r,i)=>`<div class="row"><div class="p">${r.pilot}</div><div>${tm(r.start)}</div><div>${tm(r.end)}</div><div class="count" id="cnt${i}">--:--:--</div></div>`).join("");$("planbox").classList.remove("hidden");$("live").classList.remove("hidden")}
function save(){localStorage.setItem(KEY,JSON.stringify({plan,dep:$("dep").value,arr:$("arr").value,b:$("before").value,g:$("between").value,e:$("after").value,pilots:[...document.querySelectorAll('input[name="pilots"]')].find(x=>x.checked)?.value||"3"}))}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(!s)return;for(let k of ["dep","arr"])$(k).value=s[k]||$(k).value;$("before").value=s.b??30;$("between").value=s.g??15;$("after").value=s.e??30;if(s.pilots)document.querySelector('input[name="pilots"][value="'+s.pilots+'"]').checked=true;if(s.plan){plan=s.plan;render()}}catch(e){}}
function utcMin(){let d=new Date();return d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60}
function update(){if(!plan)return;let now=utcMin(),t=now,preDeparture=false;
if(now<plan.dep){
  if(plan.arr<plan.dep && now<=plan.arr){ t=now+1440; }
  else { preDeparture=true; }
}
let rel=t-plan.dep,active=-1,next=-1;
for(let i=0;i<plan.rests.length;i++){let r=plan.rests[i],s=r.start-plan.dep,e=r.end-plan.dep;if(rel>=s&&rel<e)active=i;else if(next<0&&rel<s)next=i;
let c=$("cnt"+i);if(!c)continue;if(rel<s){c.textContent=sf((s-rel)*60);c.className="count waiting"}else if(rel<e){c.textContent=sf((e-rel)*60);c.className="count active"}else{c.textContent="COMPLETE";c.className="count done"}}
$("mfdclock").textContent=new Date().toISOString().slice(11,19)+" UTC";$("live").classList.remove("hidden");
if(preDeparture){let until=(plan.dep-now)*60;$("status").textContent="STANDBY";$("pilot").textContent="DEPARTURE "+tm(plan.dep)+" UTC";$("clock").textContent=sf(until);$("range").textContent="";$("next").textContent="PLAN READY · "+fmtDur(plan.flight)+" FLIGHT"}
else if(active>=0){let r=plan.rests[active];$("status").textContent="REST "+(active+1);$("pilot").textContent=r.pilot;$("clock").textContent=sf((r.end-t)*60);$("range").textContent=tm(r.start)+" — "+tm(r.end)+" UTC · "+fmtDur(r.end-r.start)+" REST";$("next").textContent=next>=0?"NEXT REST "+(next+1)+" · "+tm(plan.rests[next].start)+" UTC":""}
else if(next>=0){let r=plan.rests[next];$("status").textContent="FLIGHT";$("pilot").textContent="NEXT REST "+r.pilot;$("clock").textContent=sf((r.start-t)*60);$("range").textContent=tm(r.start)+" — "+tm(r.end)+" UTC · "+fmtDur(r.end-r.start)+" REST";$("next").textContent=""}
else{$("status").textContent="PLAN COMPLETE";$("pilot").textContent="";$("clock").textContent="00:00:00";$("range").textContent="";$("next").textContent=""}}
$("calc").onclick=calculate;document.querySelectorAll('input[name="pilots"]').forEach(x=>x.addEventListener("change",()=>{setCrewMode();save()}));
document.addEventListener("change",e=>{if(e.target&&/^r[123]$/.test(e.target.id))toggleCustom(+e.target.id.slice(1));});$("theme").onclick=()=>{let light=document.body.classList.toggle("light");localStorage.setItem("restThemeV8",light?"light":"dark");$("theme").textContent=light?"DARK":"LIGHT";};try{load()}catch(e){plan=null}
try{setCrewMode()}catch(e){}
try{applyTheme()}catch(e){}
if(!plan||!Array.isArray(plan.rests))try{calculate()}catch(e){err("CALCULATION ERROR")}
try{update()}catch(e){}
setInterval(()=>{try{update()}catch(e){}},1000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script><div id="appVersion">v22</div></body></html>
